# HAT-L x2 を Real-ESRGAN と同じ劣化で作った LR で学習する設定。
# train_HAT-L_SRx2_finetune.yml (bicubic の LR) との違いは「学習用 LR の作り方」だけ:
#   - LR は datasets/LR を使わず、学習中に GT から毎回ランダムに劣化させて作る (GPU 上)。
#   - 劣化の値は EDSR の学習と同じ Real-ESRGAN/EDSR/degradation_lunar_mild.yml (月面向けの弱い劣化)。
#   - JPEG 圧縮は入れない (use_jpeg: false)。
# 実行: python hat/train.py -opt options/train/train_HAT-L_SRx2_finetune_realesrgan.yml

# general settings
name: train_HAT-L_SRx2_finetune_realesrgan
model_type: RealHATMSEModel
scale: 2
num_gpu: auto
manual_seed: 0

# ----------------- 学習データを作るときの劣化 (RealHATMSEModel が使う) ----------------- #
# 値は Real-ESRGAN/EDSR/degradation_lunar_mild.yml (EDSR の学習で使った月面向けの弱い劣化) と同じ。
# 根拠 (high6 の元画像 102 枚を測定): ノイズ σ 2.3~6.7、縮小前のぼけ σ 1.3~1.8、白黒画像。
#   1 段目: ぼかしだけ (拡大縮小・ノイズなし)
#   2 段目: ちょうど 1/2 に縮小 (area/bilinear/bicubic はランダム) してから白黒ノイズ
#   最後の sinc フィルタ・JPEG は入れない
gt_usm: false    # EDSR の既定 (--gt_usm なし) と同じ。正解を強調しない
use_jpeg: false  # JPEG 圧縮は入れない

# the first degradation process
resize_prob: [0, 0, 1]   # up, down, keep: ランダムな拡大縮小はしない
resize_range: [1, 1]
gaussian_noise_prob: 1   # 1 段目のノイズは 0 (縮小後の 2 段目で入れる)
noise_range: [0, 0]
poisson_scale_range: [0, 0]
gray_noise_prob: 1
jpeg_range: [30, 95]     # use_jpeg: false なので使われない

# the second degradation process
second_blur_prob: 0
resize_prob2: [0, 0, 1]  # keep: ちょうど 1/scale に縮小する
resize_range2: [1, 1]
gaussian_noise_prob2: 0.5        # 半分はガウスノイズ、半分は明るさに比例するポアソンノイズ
noise_range2: [1.5, 7]
poisson_scale_range2: [0.15, 0.6]
gray_noise_prob2: 1              # 白黒画像なので、ノイズも 3 チャンネル共通
jpeg_range2: [30, 95]    # use_jpeg: false なので使われない

# bicubic 版と同じ 128 にそろえる (Real-ESRGAN は 256 だが、HAT-L だと GPU のメモリが足りない)
gt_size: 128
queue_size: 180  # batch_size_per_gpu で割り切れる数にする

# dataset and data loader settings
datasets:
  train:
    name: dataset1
    type: RealESRGANDataset
    # GT だけ使う (LR は学習中に作る)。bicubic 版と同じ GT フォルダ。
    # meta_info を書かなければフォルダ内の画像を全部使う。
    dataroot_gt: ./datasets/GT
    io_backend:
      type: disk

    # ぼかしの値も degradation_lunar_mild.yml と同じ
    blur_kernel_size: 21
    kernel_list: ['iso', 'aniso', 'generalized_iso', 'generalized_aniso', 'plateau_iso', 'plateau_aniso']
    kernel_prob: [0.60, 0.30, 0.05, 0.05, 0.0, 0.0]
    sinc_prob: 0
    blur_sigma: [1.0, 2.2]   # 測定値 1.3~1.8 を少し広げた範囲
    betag_range: [0.8, 2]
    betap_range: [1, 2]

    # 2 段目のぼかしは second_blur_prob: 0 なので使われない
    blur_kernel_size2: 21
    kernel_list2: ['iso', 'aniso', 'generalized_iso', 'generalized_aniso', 'plateau_iso', 'plateau_aniso']
    kernel_prob2: [0.60, 0.30, 0.05, 0.05, 0.0, 0.0]
    sinc_prob2: 0
    blur_sigma2: [0.2, 1.0]
    betag_range2: [0.8, 2]
    betap_range2: [1, 2]

    final_sinc_prob: 0  # 最後の sinc フィルタ (リンギング) は入れない

    use_hflip: true
    use_rot: true  # EDSR・bicubic 版と同じく回転も入れる

    # data loader
    use_shuffle: true
    num_worker_per_gpu: 6
    batch_size_per_gpu: 2
    dataset_enlarge_ratio: 1
    prefetch_mode: ~

  val_1:
    name: my_val
    type: PairedImageDataset
    # 検証は datasets/val の全 1909 枚を使う (1 回に約 9.5 時間かかるので、val_freq で回数を減らしている)
    dataroot_gt: ./datasets/val/GT
    dataroot_lq: ./datasets/val/LR
    io_backend:
      type: disk

# network structures (bicubic 版と同じ)
network_g:
  type: HAT
  upscale: 2
  in_chans: 3
  img_size: 64
  window_size: 16
  compress_ratio: 3
  squeeze_factor: 30
  conv_scale: 0.01
  overlap_ratio: 0.5
  img_range: 1.
  depths: [6, 6, 6, 6, 6, 6, 6, 6, 6, 6, 6, 6]
  embed_dim: 180
  num_heads: [6, 6, 6, 6, 6, 6, 6, 6, 6, 6, 6, 6]
  mlp_ratio: 2
  upsampler: 'pixelshuffle'
  resi_connection: '1conv'

# path
path:
  pretrain_network_g: experiments/pretrained_models/HAT-L_SRx2_ImageNet-pretrain.pth
  strict_load_g: true
  param_key_g: params_ema
  resume_state: ~

# training settings (bicubic 版と同じ)
train:
  ema_decay: 0.999
  optim_g:
    type: Adam
    lr: !!float 1e-5
    weight_decay: 0
    betas: [0.9, 0.99]

  scheduler:
    type: MultiStepLR
    milestones: [50000, 75000, 90000]
    gamma: 0.5

  total_iter: 100000
  warmup_iter: -1  # no warm up

  # losses
  pixel_opt:
    type: L1Loss
    loss_weight: 1.0
    reduction: mean

# validation settings
val:
  val_freq: !!float 3e4  # 30k, 60k, 90k iter と学習の最後 (100k) の計4回検証する (1回約9.5時間。全体で約3日1時間)
  save_img: false
  pbar: true

  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 2
      test_y_channel: true
      better: higher
    ssim:
      type: calculate_ssim
      crop_border: 2
      test_y_channel: true
      better: higher

# logging settings
logger:
  print_freq: 100
  save_checkpoint_freq: !!float 1e4
  use_tb_logger: true
  wandb:
    project: ~
    resume_id: ~

# dist training settings
dist_params:
  backend: nccl
  port: 29500
